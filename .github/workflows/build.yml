name: build
on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore IndieVault/IndieVault.slnx
      - run: dotnet build IndieVault/IndieVault.slnx --no-restore
      - run: dotnet test IndieVault/IndieVault.slnx --no-build --verbosity normal
