name: main-source-check
on:
  pull_request:
    branches: [main]

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Only allow develop into main
        if: github.head_ref != 'develop'
        run: |
          echo "PRs into main must come from develop (got '${{ github.head_ref }}')."
          exit 1
